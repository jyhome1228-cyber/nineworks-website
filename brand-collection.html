:root{color-scheme:light;--ink:#101010;--muted:#484848;--rule:#e9e9e9;--page:#fff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid #171717;outline-offset:4px}
.nw-header{height:67px;position:relative;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 31px;background:#fff}
.nw-header__left,.nw-header__right{display:flex;align-items:center;gap:29px}
.nw-header__right{justify-content:flex-end}
.nw-header__left a,.nw-header__right a{font-size:10px;font-weight:600;letter-spacing:.11em;white-space:nowrap}
.nw-logo{font-size:21px;letter-spacing:-.055em;font-weight:800;line-height:1}
.nw-header a{transition:opacity .25s}
.nw-header a:hover{opacity:.48}
.collection-bar{min-height:49px;display:flex;justify-content:space-between;align-items:center;padding:0 31px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);gap:16px}
.collection-bar__left,.collection-bar__right{display:flex;align-items:center;gap:22px;min-width:0}
.collection-label,.collection-count,.filter button,.sort button{font-size:10px;font-weight:600;letter-spacing:.08em;white-space:nowrap}
.collection-label{font-weight:700}
.collection-count{color:var(--muted);letter-spacing:.015em;font-variant-numeric:tabular-nums}
.filter,.sort{display:flex;align-items:center;gap:16px}
.filter button,.sort button{cursor:pointer;padding:16px 0;border:0;background:none;color:#777;transition:color .2s}
.filter button:hover,.sort button:hover,.filter button[aria-pressed=true],.sort button[aria-pressed=true]{color:#111}
.filter button[aria-pressed=true],.sort button[aria-pressed=true]{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
.collection-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.collection-card{margin:0;min-width:0;background:#fff;position:relative}
.collection-card__link{display:block;position:relative}
.collection-card__visual{position:relative;aspect-ratio:4/5;overflow:hidden;background:#e9e9e8}
.collection-card__visual img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;transition:transform .7s cubic-bezier(.2,.7,.2,1);transform:scale(1.001)}
.collection-card__link:hover .collection-card__visual img{transform:scale(1.045)}
.collection-card__fallback{display:none;position:absolute;inset:0;justify-content:center;align-items:center;padding:30px;text-align:center;background:#e7e7e5;color:#222;font-size:19px;font-weight:700;letter-spacing:-.025em}
.collection-card__visual.is-broken .collection-card__fallback{display:flex}
.collection-card__visual.is-broken img{display:none}
.collection-card__caption{display:flex;min-height:137px;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:23px 12px 28px}
.collection-card__caption strong{max-width:100%;font-size:11px;line-height:1.5;font-weight:700;letter-spacing:.015em;overflow-wrap:anywhere}
.collection-card__caption span{margin-top:7px;font-size:10px;line-height:1.6;color:#404040;font-weight:400;letter-spacing:.015em}
.collection-card__caption small{margin-top:14px;font-size:9px;line-height:1.3;font-weight:500;letter-spacing:.1em;color:#555}
.collection-footer{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;border-top:1px solid var(--rule);padding:40px 31px 52px}
.collection-footer__brand{font-weight:800;font-size:17px;letter-spacing:-.05em}
.collection-footer p{margin:10px 0 0;max-width:380px;font-size:12px;line-height:1.7;color:#555}
.collection-footer__links{display:flex;gap:25px;font-size:11px;font-weight:600;letter-spacing:.04em}
.collection-empty{grid-column:1/-1;padding:120px 25px;text-align:center;font-size:13px;color:#555}
.preview-label{display:none}
@media(min-width:1650px){.nw-header{height:71px}.collection-card__caption{min-height:150px;padding-top:27px}.collection-card__caption strong{font-size:12px}.collection-card__caption span{font-size:11px}}
@media(max-width:1100px){.collection-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.nw-header{padding-inline:22px}.collection-bar{padding-inline:22px}.nw-header__left,.nw-header__right{gap:17px}}
@media(max-width:760px){.nw-header{height:62px;padding:0 15px}.nw-logo{font-size:19px}.nw-header__left,.nw-header__right{gap:10px}.nw-header__left a,.nw-header__right a{font-size:9px}.nw-header__left a:nth-child(2),.nw-header__right a:first-child{display:none}.collection-bar{padding:12px 15px;display:flex;align-items:flex-start;flex-direction:column;gap:6px}.collection-bar__left,.collection-bar__right{width:100%;justify-content:space-between;gap:12px}.filter,.sort{gap:14px}.filter button,.sort button{padding:8px 0;font-size:9px}.collection-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.collection-card__caption{min-height:120px;padding:18px 8px 24px}.collection-card__caption strong{font-size:10px}.collection-card__caption span{font-size:9px;margin-top:5px}.collection-card__caption small{font-size:9px;margin-top:11px}.collection-footer{padding:30px 15px 35px;flex-direction:column;align-items:flex-start;gap:24px}.collection-footer p{font-size:11px}}
@media(max-width:380px){.nw-logo{font-size:17px}.filter,.sort{gap:10px}.filter button,.sort button{letter-spacing:0}.collection-card__caption{min-height:112px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.collection-card__visual img{transition:none}}

/* NINEWORKS brand collection refinement 2027-11 */

::selection{background:#161616;color:#fff}
.nw-header{height:var(--nw-h);position:sticky;top:0;z-index:80;padding-inline:clamp(16px,1.7vw,34px);border-bottom:1px solid #ededed;background:rgba(255,255,255,.98);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.nw-header__left,.nw-header__right{gap:clamp(17px,1.6vw,34px)}
.nw-header__left a,.nw-header__right a{font-size:10px;font-weight:650;letter-spacing:.07em;line-height:1.2}
.nw-header .nw-logo{display:inline-flex;align-items:center;justify-content:center;width:154px;min-width:0;line-height:1}

.collection-bar__right{gap:25px}

.sort{padding-left:24px;border-left:1px solid #dedede}
.filter button,.sort button{position:relative;padding:15px 0 14px;font-size:10px;line-height:1.2;letter-spacing:.04em;font-weight:650;color:#838383;text-decoration:none!important;transition:color .2s}
.filter button::after,.sort button::after{content:"";position:absolute;left:0;right:0;bottom:10px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left center;transition:transform .22s}
.filter button[aria-pressed=true]::after,.sort button[aria-pressed=true]::after{transform:scaleX(1)}
.filter button[aria-pressed=true],.sort button[aria-pressed=true]{color:#111}
.collection-grid{align-items:start}
.collection-card__visual{background:#eeeeec}
.collection-card__visual img{object-position:50% 48%;transition:transform .7s cubic-bezier(.22,.8,.25,1)}

.collection-card__caption{min-height:118px;padding:22px 10px 24px}
.collection-card__caption strong{font-size:11px;font-weight:740;line-height:1.55;letter-spacing:.012em}
.collection-card__caption span{margin-top:6px;font-size:10px;color:#555;letter-spacing:0;line-height:1.5}
.collection-card__caption small{margin-top:11px;font-size:9px;font-weight:550;line-height:1.4;letter-spacing:.07em;color:#888}
.collection-card__link:hover .collection-card__caption strong{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.collection-footer{margin-top:1px}
@media (min-width:1650px){
 .collection-card__caption{min-height:124px;padding-top:24px}
 .collection-card__caption strong{font-size:12px}
}
@media (max-width:1100px){
 .nw-header{padding-inline:20px}
 .collection-bar{padding-inline:20px}
 .nw-header .nw-logo{width:142px}
 .collection-bar__right{gap:15px}
 .sort{padding-left:15px}
 .filter,.sort{gap:12px}
}
@media (max-width:760px){
 :root{--nw-h:56px}
 .nw-header{height:var(--nw-h);padding:0 14px}
 .nw-header .nw-logo{width:116px}
 .nw-logo img{max-height:23px}
 .nw-header__left a,.nw-header__right a{font-size:9px;letter-spacing:.035em}
 .collection-bar{min-height:0;padding:10px 14px 8px;gap:7px}
 .collection-bar__left,.collection-bar__right{align-items:center;gap:12px}
 .collection-bar__right{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
 .collection-bar__right::-webkit-scrollbar{display:none}
 .collection-label,.collection-count{font-size:9px}
 .sort{padding-left:13px}
 .filter,.sort{gap:12px;flex-shrink:0}
 .filter button,.sort button{font-size:9px;letter-spacing:.02em;padding:8px 0 9px}
 .filter button::after,.sort button::after{bottom:5px}
 .collection-card__caption{min-height:105px;padding:18px 7px 21px}
 .collection-card__caption strong{font-size:10px}
 .collection-card__caption span{font-size:9px}
 .collection-card__caption small{font-size:8px;margin-top:10px}
}
@media (max-width:390px){
 .nw-header .nw-logo{width:104px}
 .nw-header__left a,.nw-header__right a{font-size:8px}
 .collection-bar__right{gap:9px}
 .filter,.sort{gap:9px}
}
@media (prefers-reduced-motion:reduce){
 .collection-card__visual img,.filter button::after,.sort button::after{transition:none}
}

</style>
</head>

<header class="nw-header">
  <nav class="nw-header__left" aria-label="왼쪽 메뉴">

<main>

    <div class="collection-bar__left"><span class="collection-label">BRAND COLLECTION</span><span class="collection-count" id="collection-count">SELECTED WORKS</span></div>
    <div class="collection-bar__right">
      <div class="filter" role="group" aria-label="프로젝트 유형">

</footer>

<script>
(()=>{
'use strict';
const EDITORIAL_ORDER=[["hollys","HOLLYS","Stick coffee packaging","package"],["gong-cha","GONG CHA","Bread packaging","package"],["centellian-24","CENTELLIAN 24+","Product visual design","visual"],["myv","MYV","Brand identity","identity"],["yoriko","YORIKO","Brand identity and packaging","identity"],["recelleclore","RECELLÉCLORE","Brand experience and packaging","identity"],["ouga","OUGA","Bakery cafe branding","identity"],["vaquer","VAQUER","Botanical fragrance branding","identity"],["cocos-matcha","COCO’S MATCHA","Matcha cafe branding","identity"],["jewood","JEWOOD","Skincare branding","identity"],["wooje-stay","WOOJE STAY","Hospitality brand identity","identity"],["greedy-scent","GREEDY SCENT","Fragrance branding","identity"],["pudada","PUDADA","Jelly packaging","package"],["miel","MIEL","Honey branding","identity"],["pausenality","PAUSE NALITY","Fragrance branding","identity"],["the-spa","THE SPA","Bath care branding","identity"],["fulim","FULIM","Skincare branding","identity"],["milk-please","MILK PLEASE","Bakery branding","identity"],["umer","UMER","Lifestyle brand identity","identity"],["blondy","BLONDY","Hygiene goods packaging","package"],["pour-and-bake","POUR AND BAKE","Cafe and bakery identity","identity"],["1616-brunch-coffee","1616 BRUNCH & COFFEE","Brunch cafe branding","identity"],["chapter","CHAPTER","Coffee house branding","identity"],["somsomlike","SOMSOM LIKE","Lifestyle goods branding","identity"],["seolgadang","SEOLGADANG","Cafe branding and packaging","identity"],["wiggly-yum","WIGGLY YUM","Jelly snack branding","package"],["kidsten","KIDS TEN","Health food packaging","package"],["healthd","HEALTHD","Supplement packaging","package"],["hi-protein","HI PROTEIN","Protein snack branding","package"],["puur","PUUR","Protein bar branding","package"],["jadam","JADAM","Ginseng gift packaging","package"],["acliv","ACLIV","Technology brand identity","identity"],["helibean","HELI BEAN","Coffee packaging","package"],["dev-coffee","DEV COFFEE","Specialty coffee branding","identity"],["breeze-coffee","BREEZE COFFEE","Cafe branding","identity"],["cafood","CAFOOD","Food branding and packaging","package"],["doctor-tips","DOCTOR TIPS","Skincare packaging","package"],["toylub","TOYLUB","Skincare branding","identity"],["leanbody-lab","LEANBODY LAB","Wellness branding","identity"],["roasting-visor","ROASTING VISOR","Coffee roastery branding","identity"],["make-pasta","MAKE PASTA","Food brand identity","identity"],["dreamhanger","DREAM HANGER","Pet lifestyle brand identity","identity"],["chajang","CHAJANG","Mobility platform identity","identity"],["mohb","MOHB","Cafe brand identity","identity"],["mayer","MAYER","Lifestyle branding","identity"],["we-bring","WE BRING","Mobility service branding","identity"],["world-cross","WORLD CROSS","Corporate identity renewal","identity"],["jincheon-tigre","JINCHEON TIGRE","Dessert packaging","package"],["relim-branding","RE:LIM","Brand identity","identity"]];
const projects=new Map((window.NW_PORTFOLIO||[]).map(project=>[project.id,project]));
const extra=new Map([
 ['relim-branding',{id:'relim-branding',thumbnail:'https://cdn.imweb.me/upload/S2025061194bb8d274d3cd/1c2d0d8d3c1e6.png',detailUrl:'portfolio-relim-branding.html'}]
]);
const items=EDITORIAL_ORDER.map(([id,name,description,type],index)=>{
 const project=projects.get(id)||extra.get(id);
 if(!project||!project.thumbnail)return null;
 const detail=project.detailUrl||(id==='relim-branding'?'portfolio-relim-branding.html':'portfolio-detail.html?work='+encodeURIComponent(id));
 return {id,name,description,type,index,thumbnail:project.thumbnail,href:detail};
}).filter(Boolean);
const grid=document.getElementById('collection-grid');
const count=document.getElementById('collection-count');
let category='all',sort='featured';
function makeCard(item,index){
 const card=document.createElement('article');
 card.className='collection-card';
 card.dataset.type=item.type;
 const link=document.createElement('a');
 link.className='collection-card__link';
 link.href=item.href;
 link.setAttribute('aria-label',item.name+' 프로젝트 보기');
 const visual=document.createElement('div');visual.className='collection-card__visual';
 const img=document.createElement('img');img.src=item.thumbnail;img.alt=item.name+' 프로젝트 썸네일';
 img.loading=index<8?'eager':'lazy';img.decoding='async';
 img.addEventListener('error',()=>visual.classList.add('is-broken'),{once:true});
 const fallback=document.createElement('div');fallback.className='collection-card__fallback';fallback.textContent=item.name;
 visual.append(img,fallback);
 const caption=document.createElement('div');caption.className='collection-card__caption';
 const title=document.createElement('strong');title.textContent=item.name;
 const sub=document.createElement('span');sub.textContent=item.description;
 const type=document.createElement('small');type.textContent=({identity:'BRAND IDENTITY',package:'PACKAGE DESIGN',visual:'VISUAL DESIGN'})[item.type]||'BRAND DESIGN';
 caption.append(title,sub,type);link.append(visual,caption);card.append(link);
 return card;
}
function render(){
 const shown=items.filter(item=>category==='all'||item.type===category);
 if(sort==='alphabetical')shown.sort((a,b)=>a.name.localeCompare(b.name,'en'));
 grid.replaceChildren(...shown.map(makeCard));
 if(!shown.length){const empty=document.createElement('p');empty.className='collection-empty';empty.textContent='표시할 프로젝트가 없습니다.';grid.append(empty);}
 count.textContent=String(shown.length).padStart(2,'0')+' PROJECTS';
}
document.querySelectorAll('[data-category]').forEach(button=>button.addEventListener('click',()=>{
 category=button.dataset.category;
 document.querySelectorAll('[data-category]').forEach(x=>x.setAttribute('aria-pressed',String(x===button)));
 render();
}));
document.querySelectorAll('[data-sort]').forEach(button=>button.addEventListener('click',()=>{
 sort=button.dataset.sort;
 document.querySelectorAll('[data-sort]').forEach(x=>x.setAttribute('aria-pressed',String(x===button)));
 render();
}));
render();
})();
</script>
