<body class="portfolio-page">
  <div class="site-shell">
    <header class="site-header"><a class="site-logo" href="/">NINEWORKS</a><button class="menu-trigger" type="button" aria-label="메뉴 열기" aria-expanded="false" data-menu-trigger><span></span></button></header>
    <aside class="menu-overlay" aria-hidden="true" data-menu-overlay></aside>
    <main>
      <section class="portfolio-hero container">
        <div><p class="eyebrow reveal">WORK ARCHIVE</p><h1 class="page-title reveal">Portfolio</h1></div>
        <p class="portfolio-hero__copy reveal">주요 프로젝트와 함께 웹사이트, 시스템 구축, 상세페이지, 편집디자인, IR, 패키지디자인, 행사디자인 등 실제 제작 결과물을 유형별로 확인할 수 있습니다.</p>
      </section>

      <div class="category-nav portfolio-filter" data-filter-group data-filter-target=".portfolio-filter-item">
        <button class="is-active" type="button" data-filter="major">MAJOR</button>
        <button type="button" data-filter="website">WEBSITE</button>
        <button type="button" data-filter="system">SYSTEM</button>
        <button type="button" data-filter="detailpage">DETAIL PAGE</button>
        <button type="button" data-filter="editorial">EDITORIAL</button>
        <button type="button" data-filter="ir">IR / PPT</button>
        <button type="button" data-filter="package">PACKAGE</button>
        <button type="button" data-filter="event">EVENT</button>
      </div>

      <section class="portfolio-index-head container">
        <div class="portfolio-index-head__title"><p class="eyebrow">CATEGORY</p><h2 data-portfolio-index-title>Major Works</h2></div>
        <div class="portfolio-index-head__meta"><p data-portfolio-index-copy>나인웍스의 기존 주요 포트폴리오를 모아둔 대표 작업 아카이브입니다.</p><span class="portfolio-index-head__count" data-portfolio-index-count></span></div>
      </section>

      <section class="portfolio-list container"><div class="portfolio-grid" data-portfolio-grid></div></section>

      <section class="cta">
        <div class="container"><p class="eyebrow">START A PROJECT</p><h2 class="cta__title">다음 프로젝트를 함께 만들어요.</h2></div>
        <div class="container cta__bottom"><p>브랜딩부터 웹사이트와 제작까지 필요한 범위부터 이야기해 주세요.</p><a class="text-link" href="contact.html">PROJECT INQUIRY <span>↗</span></a></div>
      </section>
    </main>
    <footer class="site-footer container"></footer>
  </div>

  <script src="assets/js/portfolio-list-1.js?v=20260810-2"></script>

  <script src="assets/js/portfolio.js?v=20260825-1"></script>
  <script>
    (()=>{
      const live={fineb:'https://finebpkg.com/','tne-epc':'https://tneepc.com/',relim:'https://re-lim.com/',aesost:'https://aesost.com/index.html',kekomi:'https://kekomi.co.kr/','the-petrichor':'https://thepetrichor.co.kr/',thomastone:'https://thomastone.co.kr/',recelleclore:'https://recelleclore.co.kr/'};
      const detail={fineb:'portfolio-fineb.html','tne-epc':'portfolio-tne-epc.html',relim:'portfolio-relim.html',aesost:'portfolio-aesost.html',kekomi:'portfolio-kekomi.html','the-petrichor':'portfolio-the-petrichor.html',thomastone:'portfolio-thomastone.html',recelleclore:'portfolio-recelleclore.html'};
      document.querySelectorAll('.portfolio-card[data-category~="develop"]').forEach(card=>{
        const a=card.querySelector('.portfolio-card__link[href*="portfolio-detail.html?work="]');
        if(!a)return;
        const m=(a.getAttribute('href')||'').match(/[?&]work=([^&#]+)/);
        const id=m?decodeURIComponent(m[1]):'';
        if(!detail[id])return;
        a.href=detail[id];
        card.classList.add('portfolio-card--develop');
        const actions=document.createElement('div');
        actions.className='portfolio-card__actions';
        actions.innerHTML=`<a class="portfolio-card__live" href="${live[id]}" target="_blank" rel="noopener">LIVE SITE ↗</a>`;
        card.appendChild(actions);
      });
    })();
  </script>
  <script src="assets/js/portfolio-develop.js?v=20260812-10"></script>
  <script src="assets/js/portfolio-filter-url.js?v=20260826-1"></script>
