<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="나인웍스의 웹사이트, 커머스, 상세·랜딩페이지, 패키지, 편집·IR, 이벤트 디자인과 브랜딩 작업을 모은 포트폴리오입니다.">
  <title>Portfolio — NINEWORKS</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/portfolio.css?v=20260817-2">
  <link rel="stylesheet" href="assets/css/portfolio-archive-v1.css?v=20260817-2">
  <link rel="stylesheet" href="assets/css/portfolio-quickview-v2.css?v=20260811-1">
  <link rel="stylesheet" href="assets/css/clarity-20260814.css?v=20260817-7">
  <link rel="stylesheet" href="assets/css/navigation-ia-20260817.css?v=20260817-2">
  <style>
    .portfolio-page .portfolio-hero{min-height:auto!important;padding-top:82px!important;padding-bottom:46px!important}
    body.portfolio-page .category-nav.portfolio-filter{position:relative!important;top:auto!important;z-index:2!important;display:grid!important;grid-template-columns:repeat(8,minmax(0,1fr))!important;width:min(calc(100% - 48px),var(--container,1440px))!important;max-width:var(--container,1440px)!important;margin:0 auto!important;padding:0!important;overflow:visible!important;background:#fff!important;backdrop-filter:none!important;box-shadow:none!important}
    body.portfolio-page .category-nav.portfolio-filter button{flex:none!important;width:100%!important;min-width:0!important;min-height:50px!important;padding:0 10px!important;border:0!important;border-right:1px solid var(--line)!important;border-bottom:1px solid var(--line)!important;background:#fff!important;white-space:nowrap!important}
    body.portfolio-page .category-nav.portfolio-filter button:first-child{border-left:1px solid var(--line)!important}
    body.portfolio-page .category-nav.portfolio-filter button.is-active{color:#111!important;background:#f2f2ef!important}
    .portfolio-page .portfolio-index-head{position:relative!important;z-index:1!important}
    .portfolio-page .portfolio-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
    .portfolio-card--develop .portfolio-card__actions{display:flex;justify-content:flex-end;margin-top:9px}
    .portfolio-card--develop .portfolio-card__live{display:inline-flex;padding:7px 11px;border:1px solid #d3d3cf;border-radius:999px;color:#555;font-size:9px;font-weight:600}
    @media(max-width:1100px){
      body.portfolio-page .category-nav.portfolio-filter{display:flex!important;grid-template-columns:none!important;width:min(calc(100% - 40px),var(--container,1440px))!important;overflow-x:auto!important;scrollbar-width:none!important}
      body.portfolio-page .category-nav.portfolio-filter::-webkit-scrollbar{display:none!important}
      body.portfolio-page .category-nav.portfolio-filter button{flex:0 0 auto!important;width:auto!important;min-width:118px!important;padding:0 16px!important}
    }
    @media(max-width:760px){
      body.portfolio-page .category-nav.portfolio-filter{width:calc(100% - 36px)!important}
      body.portfolio-page .category-nav.portfolio-filter button{min-width:auto!important;padding:0 15px!important}
      .portfolio-page .portfolio-grid{grid-template-columns:1fr!important}
      .portfolio-card--develop .portfolio-card__actions{justify-content:flex-start}
    }
  </style>
</head>
<body class="portfolio-page">
  <div class="site-shell">
    <header class="site-header"><a class="site-logo" href="/">NINEWORKS</a><button class="menu-trigger" type="button" aria-label="메뉴 열기" aria-expanded="false" data-menu-trigger><span></span></button></header>
    <aside class="menu-overlay" aria-hidden="true" data-menu-overlay></aside>
    <main>
      <section class="portfolio-hero container">
        <div><p class="eyebrow reveal">WORK ARCHIVE</p><h1 class="page-title reveal">Portfolio</h1></div>
        <p class="portfolio-hero__copy reveal">브랜딩 전체 작업과 함께 웹사이트, 커머스, 랜딩·상세페이지, 패키지, 편집·IR, 이벤트 등 실제 제작한 결과물을 카테고리별로 확인할 수 있습니다.</p>
      </section>

      <div class="category-nav portfolio-filter" data-filter-group data-filter-target=".portfolio-filter-item">
        <button class="is-active" type="button" data-filter="all">ALL</button>
        <button type="button" data-filter="website">WEBSITE</button>
        <button type="button" data-filter="commerce">COMMERCE</button>
        <button type="button" data-filter="detailpage">LANDING / DETAIL</button>
        <button type="button" data-filter="package">PACKAGE</button>
        <button type="button" data-filter="editorial">EDITORIAL</button>
        <button type="button" data-filter="ir">IR / PPT</button>
        <button type="button" data-filter="event">EVENT</button>
      </div>

      <section class="portfolio-index-head container">
        <div class="portfolio-index-head__title"><p class="eyebrow">CATEGORY</p><h2 data-portfolio-index-title>All Works</h2></div>
        <div class="portfolio-index-head__meta"><p data-portfolio-index-copy>브랜딩 케이스스터디와 각종 제작물을 한곳에서 확인할 수 있습니다.</p><span class="portfolio-index-head__count" data-portfolio-index-count></span></div>
      </section>

      <section class="portfolio-list container"><div class="portfolio-grid" data-portfolio-grid></div></section>

      <section class="cta">
        <div class="container"><p class="eyebrow">START A PROJECT</p><h2 class="cta__title">다음 프로젝트를 함께 만들어요.</h2></div>
        <div class="container cta__bottom"><p>브랜딩부터 웹사이트와 제작까지 필요한 범위부터 이야기해 주세요.</p><a class="text-link" href="contact.html">PROJECT INQUIRY <span>↗</span></a></div>
      </section>
    </main>
    <footer class="site-footer container"></footer>
  </div>

  <script src="assets/js/portfolio-list-1.js?v=20260810-2"></script>
  <script src="assets/js/portfolio-list-2.js?v=20260810-2"></script>
  <script src="assets/js/portfolio-list-3.js?v=20260810-2"></script>
  <script src="assets/js/portfolio-list-4.js?v=20260812-10"></script>
  <script src="assets/js/portfolio-list-5.js?v=20260812-2"></script>
  <script src="assets/js/portfolio-taxonomy.js?v=20260817-1"></script>
  <script src="assets/js/portfolio-archive-data.js?v=20260811-1"></script>
  <script src="assets/js/detailpage-archive-data.js?v=20260811-1"></script>
  <script src="assets/js/main.js?v=20260817-2"></script>
  <script src="assets/js/portfolio.js?v=20260811-4"></script>
  <script>
    (()=>{
      const live={fineb:'https://finebpkg.com/','tne-epc':'https://tneepc.com/',relim:'https://re-lim.com/',aesost:'https://aesost.com/index.html',kekomi:'https://kekomi.co.kr/','the-petrichor':'https://thepetrichor.co.kr/',thomastone:'https://thomastone.co.kr/',recelleclore:'https://recelleclore.co.kr/'};
      const detail={fineb:'portfolio-fineb.html','tne-epc':'portfolio-tne-epc.html',relim:'portfolio-relim.html',aesost:'portfolio-aesost.html',kekomi:'portfolio-kekomi.html','the-petrichor':'portfolio-the-petrichor.html',thomastone:'portfolio-thomastone.html',recelleclore:'portfolio-recelleclore.html'};
      document.querySelectorAll('.portfolio-card[data-category~="develop"]').forEach(card=>{
        const a=card.querySelector('.portfolio-card__link[href*="portfolio-detail.html?work="]');
        if(!a)return;
        const m=(a.getAttribute('href')||'').match(/[?&]work=([^&#]+)/);
        const id=m?decodeURIComponent(m[1]):'';
        if(!detail[id])return;
        a.href=detail[id];
        card.classList.add('portfolio-card--develop');
        const actions=document.createElement('div');
        actions.className='portfolio-card__actions';
        actions.innerHTML=`<a class="portfolio-card__live" href="${live[id]}" target="_blank" rel="noopener">LIVE SITE ↗</a>`;
        card.appendChild(actions);
      });
    })();
  </script>
  <script src="assets/js/portfolio-develop.js?v=20260812-10"></script>
  <script src="assets/js/portfolio-filter-url.js?v=20260817-2"></script>
</body>
</html>
