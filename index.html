<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://9works.kr/">
<link rel="icon" type="image/png" href="/favicon.png">
<title>나인웍스 홈페이지 개편 안내 | NINEWORKS</title>
<meta name="description" content="나인웍스 홈페이지는 2026년 11월 10일부터 12월 10일까지 개편 중입니다. 2026년 프로젝트 조기 마감으로 신규 접수는 진행하지 않습니다.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="NINEWORKS">
<meta property="og:title" content="나인웍스 홈페이지 개편 안내">
<meta property="og:description" content="2026년 프로젝트 조기 마감 및 홈페이지 개편 기간 안내">
<meta property="og:url" content="https://9works.kr/">
<meta property="og:image" content="https://9works.kr/assets/kakao-preview.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap');
:root{color-scheme:dark;--bg:#080808;--fg:#f5f5f5;--secondary:#b0b0b0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg)}
body{font-family:'Noto Sans KR',Arial,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
.logo{display:block;width:145px;height:auto;filter:brightness(0) invert(1)}
.splash{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:var(--bg);transition:opacity .6s ease,visibility .6s}
.splash .logo{width:172px;animation:appear 1.1s ease both}
.splash.done{opacity:0;visibility:hidden;pointer-events:none}
@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.page{min-height:100svh;display:flex;flex-direction:column;align-items:center;opacity:0;transition:opacity .7s ease}
.page.show{opacity:1}
.header{width:100%;display:flex;justify-content:center;padding:56px 24px 0}
.content{width:min(100% - 40px,660px);flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 0 110px}
h1{font-size:clamp(27px,2.65vw,36px);line-height:1.45;letter-spacing:-.055em;font-weight:500;margin:0 0 30px}
.copy{max-width:600px;color:var(--secondary);font-size:clamp(14px,1.06vw,15px);line-height:1.95;letter-spacing:-.022em;font-weight:400}
.copy p{margin:0 0 16px}
.copy strong{color:#eee;font-weight:500}
.period{color:#858585;font-size:12px;letter-spacing:.015em;margin-top:27px}
.footer{padding:0 20px 34px;color:#666;font-size:10px;letter-spacing:.03em;text-align:center}
@media(max-width:600px){.header{padding-top:38px}.logo{width:125px}.splash .logo{width:154px}.content{width:min(100% - 42px,460px);padding:65px 0 90px}h1{font-size:clamp(25px,6.1vw,30px);margin-bottom:24px}.copy{font-size:13.5px;line-height:1.9}.copy p{margin-bottom:17px}.copy br{display:none}.period{font-size:11px;margin-top:19px}.footer{padding-bottom:25px}}
@media(prefers-reduced-motion:reduce){.splash{display:none}.page{opacity:1}*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="splash" id="splash" aria-hidden="true"><img class="logo" src="/assets/nineworks-renewal-logo.svg" alt=""></div>
<div class="page" id="page">
<header class="header"><img class="logo" src="/assets/nineworks-renewal-logo.svg" alt="NINEWORKS"></header>
<main class="content">
<h1>나인웍스 홈페이지 개편 안내</h1>
<div class="copy">
<p>더 나은 서비스를 위해 홈페이지를 새롭게 개편하고 있습니다.</p>
<p>많은 성원 덕분에 <strong>2026년 프로젝트 일정은 조기 마감</strong>되었습니다.<br>개편 기간에는 신규 프로젝트 접수를 진행하지 않습니다.</p>
<p>현재 진행 중인 프로젝트에 최선을 다해<br>더 좋은 결과로 보답하겠습니다. 감사합니다.</p>
</div>
<p class="period">2026. 11. 10 – 12. 10</p>
</main>
<footer class="footer">© 2026 NINEWORKS</footer>
</div>
<script>
(function(){
var splash=document.getElementById('splash'),page=document.getElementById('page');
if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){splash.hidden=true;page.classList.add('show');return;}
window.setTimeout(function(){page.classList.add('show');splash.classList.add('done')},1350);
window.setTimeout(function(){splash.hidden=true},2050);
})();
</script>
</body>
</html>
