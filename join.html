<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="NINEWORKS Members 로그인 페이지입니다.">
  <meta name="robots" content="noindex,nofollow">
  <title>Login — NINEWORKS</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/clarity-20260814.css?v=20260817-8">
  <link rel="stylesheet" href="assets/css/navigation-ia-20260817.css?v=20260817-5">
  <link rel="stylesheet" href="assets/css/site-stable-20260817.css?v=20260818-1">
  <link rel="stylesheet" href="assets/css/members-20260823.css?v=20260823-1">
  <link rel="stylesheet" href="assets/css/member-login-only-20260823.css?v=20260824-1">
</head>
<body class="member-page join-page member-login-only">
<div class="site-shell">
  <header class="site-header"><a class="site-logo" href="/" aria-label="나인웍스 홈">NINEWORKS</a><button class="menu-trigger" type="button" aria-label="메뉴 열기" aria-expanded="false" data-menu-trigger><span></span></button></header>
  <aside class="menu-overlay" aria-hidden="true" data-menu-overlay></aside>
  <main>
    <div class="member-login-wrap">
      <div class="member-login-head">
        <p class="eyebrow">NINEWORKS MEMBERS</p>
        <h1>Login.</h1>
        <p>가입한 이메일과 비밀번호를 입력해 주세요.</p>
      </div>
      <div class="member-panel member-login-panel" data-auth-panel>
        <section data-auth-view="login">
          <form data-login-form>
            <div class="member-fields">
              <label class="member-field member-field--wide"><span>EMAIL</span><input name="email" type="email" autocomplete="email" required></label>
              <label class="member-field member-field--wide"><span>PASSWORD</span><input name="password" type="password" autocomplete="current-password" required></label>
            </div>
            <div class="member-login-meta"><button type="button" class="member-plain-button" data-reset-password>비밀번호 재설정</button></div>
            <p class="member-form-note" data-login-note></p>
            <button class="member-button" type="submit"><span>LOGIN</span><span>↗</span></button>
          </form>
          <div class="member-register-entry">
            <span>아직 회원이 아니신가요?</span>
            <a href="register.html">회원가입 <span>↗</span></a>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>
<script src="assets/js/main.js?v=20260817-7"></script>
</body>
</html>
