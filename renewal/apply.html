<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#090909"><title>지원 신청 | NINEWORKS</title><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="./assets/css/style.css?v=2"><style>
.apply-main{padding:76px 0 110px}.apply-intro{max-width:850px;margin-bottom:48px}.apply-intro h1{font-size:clamp(27px,3vw,38px);font-weight:600;letter-spacing:-.05em;margin:0 0 16px}.apply-intro p{font-size:15px;color:#bcbcbc;line-height:1.9;margin:0}.apply-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:50px;border-top:1px solid #303030;padding-top:45px}.apply-layout h2{font-size:19px;font-weight:600;margin:0}.apply-form{max-width:730px}.apply-field{margin-bottom:25px}.apply-field label{display:block;font-size:14px;font-weight:500;margin-bottom:9px}.apply-field label span{font-size:12px;color:#a5a5a5;font-weight:400}.apply-field input,.apply-field select,.apply-field textarea{width:100%;background:#101010;color:#f2f2f2;border:1px solid #444;border-radius:0;padding:13px 15px;font:inherit;font-size:15px;line-height:1.65;outline:none}.apply-field textarea{min-height:132px;resize:vertical}.apply-field input:focus,.apply-field select:focus,.apply-field textarea:focus{border-color:#fff}.apply-field input::placeholder,.apply-field textarea::placeholder{color:#777}.apply-columns{display:grid;grid-template-columns:1fr 1fr;gap:20px}.apply-consent{display:flex;gap:12px;align-items:flex-start;color:#bcbcbc;font-size:13px;line-height:1.8;margin:32px 0}.apply-consent input{margin-top:6px;accent-color:#fff}.apply-submit{background:#f2f2f2;border:1px solid #f2f2f2;color:#090909;padding:14px 26px;font:inherit;font-weight:600;cursor:pointer}.apply-submit:disabled{opacity:.5;cursor:wait}.apply-status{font-size:13px;line-height:1.8;color:#c4c4c4;margin:18px 0}.apply-back{display:inline-block;margin-top:30px;color:#bbb;font-size:13px}.apply-portfolio{border-top:1px solid #303030;padding-top:22px;margin-top:28px;color:#bcbcbc;font-size:14px;line-height:1.85}.apply-portfolio a{color:#fff;text-decoration:underline;text-underline-offset:4px}.apply-footer{border-top:1px solid #303030;padding:28px 0;color:#888;font-size:12px}.apply-contact{font-size:13px;color:#fff}.apply-logo img{width:145px;filter:brightness(0) invert(1);display:block}@media(max-width:700px){.apply-main{padding:55px 0 75px}.apply-layout{grid-template-columns:1fr;gap:25px}.apply-columns{grid-template-columns:1fr;gap:0}.apply-logo img{width:125px}.apply-field input,.apply-field textarea,.apply-field select{font-size:16px}}
</style></head><body><header class="site-header"><div class="wrap header-inner"><a class="apply-logo" href="./" aria-label="나인웍스 홈"><img src="/assets/nineworks-renewal-logo.svg" alt="NINEWORKS"></a><a class="apply-contact" href="mailto:info@9works.kr">Contact</a></div></header><main class="apply-main"><div class="wrap"><div class="apply-intro"><h1>나인웍스 지원 신청</h1><p>지금의 완성도보다 앞으로의 성장 가능성을 보고 싶습니다. 자신의 경험과 생각, 앞으로 이루고 싶은 목표를 자유롭게 들려주세요.</p></div><div class="apply-layout"><h2>지원서 작성</h2><form class="apply-form" id="applicationForm">
<div class="apply-columns"><div class="apply-field"><label for="appName">이름 *</label><input id="appName" name="name" autocomplete="name" maxlength="60" required></div><div class="apply-field"><label for="appEmail">이메일 *</label><input id="appEmail" name="email" type="email" autocomplete="email" maxlength="150" required></div></div>
<div class="apply-field"><label for="appPhone">연락처 *</label><input id="appPhone" name="phone" type="tel" autocomplete="tel" maxlength="30" placeholder="010-0000-0000" required></div>
<div class="apply-field"><label for="appMotivation">지원 동기 *</label><textarea id="appMotivation" name="motivation" maxlength="3000" minlength="20" placeholder="나인웍스와 함께하고 싶은 이유를 적어주세요." required></textarea></div>
<div class="apply-field"><label for="appGoal">앞으로의 목표 *</label><textarea id="appGoal" name="goal" maxlength="3000" minlength="20" placeholder="앞으로 어떤 디자이너, 어떤 전문가로 성장하고 싶은가요?" required></textarea></div>
<div class="apply-field"><label for="appSkills">주력 기술 및 활용 도구 *</label><textarea id="appSkills" name="skills" rows="3" maxlength="1500" minlength="2" placeholder="디자인 툴, AI 활용 경험, 개발 또는 기타 전문 기술" required></textarea></div>
<div class="apply-field"><label for="appEducation">최종학력 *</label><input id="appEducation" name="education" maxlength="200" placeholder="학교·전공·졸업 상태 등을 자유롭게 작성" required></div>
<div class="apply-field"><label for="appExperience">경력 <span>신입은 '신입'으로 기재</span></label><textarea id="appExperience" name="experience" rows="3" maxlength="2000" placeholder="근무 경력, 프리랜서 활동, 프로젝트 경험 등"></textarea></div>
<div class="apply-field"><label for="appAwards">수상 경력 <span>해당 없으면 비워두세요</span></label><textarea id="appAwards" name="awards" rows="3" maxlength="1500" placeholder="대회명, 수상 내역, 수상 연도 등"></textarea></div>
<label class="apply-consent"><input type="checkbox" name="consent" required><span>채용 심사를 위한 개인정보 수집·이용에 동의합니다. 수집 항목은 지원서에 입력한 이름, 이메일, 연락처, 학력, 경력 및 자기소개 정보이며, 채용 검토 목적에 사용됩니다. 지원 검토 종료 후 1년 이내 또는 삭제 요청 시 파기합니다. 동의를 거부할 수 있으나 이 경우 온라인 지원이 제한됩니다.</span></label>
<button class="apply-submit" type="submit" id="applySubmit">지원서 제출하기</button><p class="apply-status" id="applyStatus" role="status" aria-live="polite"></p>
<div class="apply-portfolio"><strong>포트폴리오 안내</strong><p>포트폴리오 파일 또는 링크는 <a id="portfolioEmail" href="mailto:info@9works.kr?subject=NINEWORKS%20%ED%8F%AC%ED%8A%B8%ED%8F%B4%EB%A6%AC%EC%98%A4%20%EC%A0%9C%EC%B6%9C">info@9works.kr</a>로 별도 제출해 주세요. 온라인 지원서와 동일한 이름으로 보내주시면 확인에 도움이 됩니다.</p></div><a class="apply-back" href="./recruit.html">채용 안내로 돌아가기</a>
</form></div></div></main><footer class="apply-footer"><div class="wrap">© 2026 NINEWORKS</div></footer><script type="module" src="./assets/js/application.js"></script></body></html>
