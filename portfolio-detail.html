<script>
(() => {
  const developSites = {
    fineb: 'https://finebpkg.com/',
    'tne-epc': 'https://tneepc.com/',
    relim: 'https://re-lim.com/',
    aesost: 'https://aesost.com/index.html',
    kekomi: 'https://kekomi.co.kr/',
    'the-petrichor': 'https://thepetrichor.co.kr/'
  };

  const escapeHTML = (value = '') => String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\"/g, '&quot;')
    .replace(/'/g, '&#039;');

  const fallbackRender = () => {
    const root = document.querySelector('[data-portfolio-detail-root]');
    if (!root || !root.querySelector('.portfolio-loading')) return;

    const id = (new URLSearchParams(location.search).get('work') || '').replace(/[^a-z0-9-]/gi, '');
    const project = Array.isArray(window.NW_PORTFOLIO)
      ? window.NW_PORTFOLIO.find((item) => item && item.id === id)
      : null;

    if (!project) {
      root.innerHTML = '<section class="portfolio-not-found"><p class="eyebrow">Portfolio</p><h1>Project not found.</h1><a class="text-link" href="portfolio.html">BACK TO PORTFOLIO <span>↗</span></a></section>';
      return;
    }

    const liveUrl = developSites[id] || '';
    const liveLink = liveUrl
      ? `<a class="portfolio-detail-live" href="${escapeHTML(liveUrl)}" target="_blank" rel="noopener noreferrer"><span>VIEW LIVE SITE</span><span>↗</span></a>`
      : '';

    root.className = 'portfolio-split-detail';
    root.innerHTML = `<aside class="portfolio-detail-sidebar"><div class="portfolio-detail-sidebar__inner">
      <div class="portfolio-detail-sidebar__top">
        <p class="portfolio-detail-kicker">Develop / Digital System</p>
        <h1>${escapeHTML(project.title || '')}</h1>
        <p class="portfolio-detail-scope">${escapeHTML(project.subtitle || project.scope || '')}</p>
        ${liveLink}
      </div>
      <div class="portfolio-detail-story">
        <p class="portfolio-detail-story__lead">${escapeHTML(project.subtitle || project.scope || '')}</p>
        <p class="portfolio-detail-story__summary">프로젝트 상세 데이터를 불러오는 동안 기본 정보를 먼저 표시하고 있습니다. 상세 콘텐츠는 자동으로 이어서 로드됩니다.</p>
      </div>
      <dl class="portfolio-detail-facts">
        <div><dt>Client</dt><dd>${escapeHTML(project.client || project.title || '')}</dd></div>
        <div><dt>Scope</dt><dd>${escapeHTML(project.scope || '')}</dd></div>
        <div><dt>Category</dt><dd>Develop · Digital System</dd></div>
      </dl>
      <a class="portfolio-detail-back" href="portfolio.html">← Back to Portfolio</a>
    </div></aside>
    <article class="portfolio-detail-scroll">
      ${project.thumbnail ? `<figure class="portfolio-scroll-media portfolio-scroll-media--hero is-visible"><img src="${escapeHTML(project.thumbnail)}" alt="${escapeHTML(project.title || '')} main visual"></figure>` : ''}
      <section class="portfolio-scroll-section">
        <header class="portfolio-scroll-section__head"><div class="portfolio-scroll-section__meta"><span class="portfolio-scroll-section__index">01</span><span class="portfolio-scroll-section__label">Project Overview</span></div><h2>${escapeHTML(project.subtitle || project.title || '')}</h2></header>
        <div class="portfolio-scroll-copy"><p>${escapeHTML(project.scope || '')}</p></div>
      </section>
    </article>`;
  };

  window.setTimeout(fallbackRender, 900);
  window.setTimeout(fallbackRender, 2500);
})();
</script>
