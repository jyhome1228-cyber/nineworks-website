name: Update ISKEY maintenance and recipient

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-iskey-maintenance.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update ISKEY proposal documents
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('proposal/iskey/index.html')
          prn = Path('proposal/iskey/print.html')
          quote = Path('proposal/iskey/quotation.html')

          # Main proposal
          s = index.read_text(encoding='utf-8')
          s = s.replace('ISKEY / Notefolio Agency', 'ISKEY').replace('ISKEY / Notefolio', 'ISKEY')
          s = s.replace('노트폴리오 에이전시 / 송진석 이사님', '이즈키 브랜드 담당자 귀하')
          s = re.sub(r'<p class="closing-thanks">[^<]*(?:송진석|노트폴리오|Notefolio)[^<]*</p>',
                     '<p class="closing-thanks">문의 주셔서 감사합니다. 이즈키의 첫 론칭이 이후 브랜드의 기준이 될 수 있도록, 프로젝트 전 과정에서 일관된 시각 시스템과 완성도 높은 결과물을 준비하겠습니다.</p>', s)
          if '<strong>2 Months Maintenance</strong>' not in s:
              s = s.replace('<li><strong>Basic Detail Page</strong>브랜드와 제품 핵심 내용을 중심으로 한 간략 상세페이지 구성</li>',
                            '<li><strong>Basic Detail Page</strong>브랜드와 제품 핵심 내용을 중심으로 한 간략 상세페이지 구성</li><li><strong>2 Months Maintenance</strong>최종 납품 후 2개월간 구축 결과물의 경미한 수정·보완 및 적용 지원</li>')
              s = s.replace('<li><strong>Instagram Launch Feed</strong>브랜드·제품·컬러·Feature 중심 초기 홍보 피드 약 9종 내외</li>',
                            '<li><strong>Instagram Launch Feed</strong>브랜드·제품·컬러·Feature 중심 초기 홍보 피드 약 9종 내외</li><li><strong>2 Months Maintenance</strong>최종 납품 후 2개월간 구축 결과물의 경미한 수정·보완 및 적용 지원</li>')
              s = s.replace('<div class="compare-row"><div>Instagram Launch Feed</div><div class="muted">—</div><div class="yes">약 9종</div></div>',
                            '<div class="compare-row"><div>Instagram Launch Feed</div><div class="muted">—</div><div class="yes">약 9종</div></div><div class="compare-row"><div>2 Months Maintenance</div><div class="yes">Included</div><div class="yes">Included</div></div>')
          if '<h3>유지보수 2개월</h3>' not in s:
              marker = '</div></div></section>\n\n<section class="proposal-section"><div class="proposal-shell closing-copy">'
              maintenance = '<article class="note-row"><h3>유지보수 2개월</h3><p>최종 결과물 납품 후 2개월간 구축된 브랜드·패키지·디지털 결과물을 기준으로 경미한 수정, 오탈자 보완, 적용 과정의 디자인 검수 및 운영 지원을 제공합니다. 신규 디자인 개발, 신규 SKU 추가, 대규모 구조 변경은 별도 협의합니다.</p></article>'
              pos = s.find(marker)
              if pos != -1:
                  # insert before the closing of note-list section
                  before = s[:pos]
                  last_close = before.rfind('</div>')
                  if last_close != -1:
                      s = before[:last_close] + maintenance + before[last_close:] + s[pos:]
          index.write_text(s, encoding='utf-8')

          # Print proposal
          s = prn.read_text(encoding='utf-8')
          s = s.replace('ISKEY / Notefolio Agency', 'ISKEY').replace('ISKEY / Notefolio', 'ISKEY')
          s = s.replace('노트폴리오 에이전시 / 송진석 이사님', '이즈키 브랜드 담당자 귀하')
          s = re.sub(r'<p class="thanks">[^<]*(?:송진석|노트폴리오|Notefolio)[^<]*</p>',
                     '<p class="thanks">문의 주셔서 감사합니다. 이즈키의 첫 론칭이 이후 브랜드의 기준이 될 수 있도록, 프로젝트 전 과정에서 일관된 시각 시스템과 완성도 높은 결과물을 준비하겠습니다.</p>', s)
          if '<b>2 Months Maintenance</b>' not in s:
              s = s.replace('<li><b>Basic Detail Page</b>브랜드·제품 핵심 정보 중심 간략 구성</li>',
                            '<li><b>Basic Detail Page</b>브랜드·제품 핵심 정보 중심 간략 구성</li><li><b>2 Months Maintenance</b>최종 납품 후 2개월 경미한 수정·보완 및 적용 지원</li>')
              s = s.replace('<li><b>Instagram Launch Feed</b>초기 홍보 피드 약 9종 내외</li>',
                            '<li><b>Instagram Launch Feed</b>초기 홍보 피드 약 9종 내외</li><li><b>2 Months Maintenance</b>최종 납품 후 2개월 경미한 수정·보완 및 적용 지원</li>')
          if '<h3>유지보수</h3>' not in s:
              s = s.replace('<article class="note"><h3>온라인 스토어 / 웹사이트 범위</h3>',
                            '<article class="note"><h3>유지보수</h3><p>최종 납품 후 2개월간 구축 결과물의 경미한 수정·보완과 적용 지원을 제공합니다. 신규 디자인 개발 및 대규모 구조 변경은 별도 협의합니다.</p></article><article class="note"><h3>온라인 스토어 / 웹사이트 범위</h3>')
          prn.write_text(s, encoding='utf-8')

          # Quotation
          s = quote.read_text(encoding='utf-8')
          s = re.sub(r'(<div class="row"><b>수신</b><span>).*?(</span></div>)', r'\1이즈키 브랜드 담당자 귀하\2', s, count=1)
          s = s.replace('노트폴리오 에이전시 / 송진석 이사님', '이즈키 브랜드 담당자 귀하')
          if '<b>2 Months Maintenance</b>' not in s:
              s = s.replace('<div><b>Basic Detail Page</b><span>브랜드와 제품 핵심 내용을 중심으로 한 간략 상세페이지 구성</span></div>',
                            '<div><b>Basic Detail Page</b><span>브랜드와 제품 핵심 내용을 중심으로 한 간략 상세페이지 구성</span></div><div><b>2 Months Maintenance</b><span>최종 납품 후 2개월간 경미한 수정·보완 및 적용 지원</span></div>')
              s = s.replace('<div><b>Instagram Launch Feed</b><span>브랜드·제품·컬러·Feature 중심 초기 홍보 피드 약 9종 내외</span></div>',
                            '<div><b>Instagram Launch Feed</b><span>브랜드·제품·컬러·Feature 중심 초기 홍보 피드 약 9종 내외</span></div><div><b>2 Months Maintenance</b><span>최종 납품 후 2개월간 경미한 수정·보완 및 적용 지원</span></div>')
          if '<strong>Maintenance</strong>' not in s:
              s = s.replace('<div class="note"><strong>Payment</strong>',
                            '<div class="note"><strong>Maintenance</strong><span>최종 결과물 납품 후 2개월간 구축된 결과물을 기준으로 경미한 수정, 오탈자 보완, 적용 과정의 디자인 검수 및 운영 지원을 제공합니다. 신규 디자인 개발, 신규 SKU 추가 및 대규모 구조 변경은 별도 협의합니다.</span></div><div class="note"><strong>Payment</strong>')
          quote.write_text(s, encoding='utf-8')

          # Hard verification
          for p in (index, prn, quote):
              text = p.read_text(encoding='utf-8')
              for token in ('Notefolio', '노트폴리오', '송진석'):
                  if token in text:
                      raise SystemExit(f'Remaining reference in {p}: {token}')
          if '이즈키 브랜드 담당자 귀하' not in quote.read_text(encoding='utf-8'):
              raise SystemExit('Quotation recipient not corrected')
          PY
      - name: Commit updated documents
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add proposal/iskey/index.html proposal/iskey/print.html proposal/iskey/quotation.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Add two month maintenance to ISKEY proposal'
            git push
          fi
