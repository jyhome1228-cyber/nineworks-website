name: Refresh Phyto payment visibility once

on:
  push:
    paths:
      - '.github/workflows/bump-phyto-payment-visibility-once-20260827.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump module cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename in ['client/phyto/index.html', 'client/phyto/contract.html']:
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              s = s.replace('phyto-contract-payment-20260827.js?v=20260827-1', 'phyto-contract-payment-20260827.js?v=20260827-2')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/phyto/index.html client/phyto/contract.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh Phyto admin-published payment visibility"
          git push
