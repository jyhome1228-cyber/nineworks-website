name: Apply admin favicon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-favicon.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add NINEWORKS favicon to admin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('admin.html')
          html = p.read_text(encoding='utf-8')
          html = re.sub(r'\s*<link\b[^>]*rel=["\'][^"\']*icon[^"\']*["\'][^>]*>', '', html, flags=re.I)
          tags = '''\n  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260825-2">\n  <link rel="alternate icon" type="image/png" href="favicon.png?v=20260825-2">'''
          html = html.replace('  <title>Admin — NINEWORKS</title>', '  <title>Admin — NINEWORKS</title>' + tags, 1)
          p.write_text(html, encoding='utf-8')
          PY
      - name: Commit admin favicon
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Apply NINEWORKS favicon to admin" || exit 0
          git push
