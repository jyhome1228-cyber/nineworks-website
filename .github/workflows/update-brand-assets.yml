name: Update brand preview and favicon

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-brand-assets.yml

permissions:
  contents: write

jobs:
  update-assets:
    if: github.event.head_commit.message != 'Remove temporary brand asset workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download social preview image
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://cdn.imweb.me/upload/S20251117d55057592d551/651b9bd804193.png' \
            -o assets/kakao-preview.png

      - name: Replace favicon SVG
        shell: bash
        run: |
          cat > favicon.svg <<'SVG'
          <?xml version="1.0" encoding="UTF-8"?>
          <svg id="_레이어_1" data-name="레이어_1" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 108.73 99.8">
            <defs>
              <style>
                .st0 {
                  fill: #040000;
                }
              </style>
            </defs>
            <path class="st0" d="M108.73,68.21v13.2c0,.74-.48,1.39-1.18,1.62l-53.1,16.75-.11.03H1.69c-.94,0-1.69-.76-1.69-1.69v-13.19c0-.74.48-1.39,1.18-1.62l52.97-16.71c.16-.05.34-.08.51-.08h52.38c.94,0,1.69.76,1.69,1.69Z"/>
            <path class="st0" d="M108.73,1.69v13.2c0,.74-.48,1.39-1.18,1.62l-52.85,16.67c-.16.05-.34.08-.51.08H1.69c-.94,0-1.69-.76-1.69-1.69v-13.14c0-.74.48-1.39,1.18-1.62L54.2.08c.16-.05.34-.08.51-.08h52.33c.94,0,1.69.76,1.69,1.69Z"/>
            <path class="st0" d="M108.73,34.95v13.18c0,.74-.48,1.39-1.18,1.62l-53.1,16.75h-.05s-52.71.01-52.71.01c-.94,0-1.69-.76-1.69-1.69v-13.14c0-.74.48-1.39,1.18-1.62l53.02-16.73c.16-.05.34-.08.51-.08h52.33c.94,0,1.69.76,1.69,1.69Z"/>
          </svg>
          SVG

      - name: Build PNG favicon fallback
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          import io
          from PIL import Image
          import cairosvg

          raw = cairosvg.svg2png(url='favicon.svg', output_width=464)
          icon = Image.open(io.BytesIO(raw)).convert('RGBA')
          canvas = Image.new('RGBA', (512, 512), (0, 0, 0, 0))
          x = (512 - icon.width) // 2
          y = (512 - icon.height) // 2
          canvas.alpha_composite(icon, (x, y))
          canvas.save('favicon.png', optimize=True)
          PY

      - name: Commit updated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/kakao-preview.png favicon.svg favicon.png
          if git diff --cached --quiet; then
            echo 'No asset changes detected.'
            exit 0
          fi
          git commit -m 'Update social preview and favicon'
          git push