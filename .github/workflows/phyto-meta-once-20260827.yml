name: "Phyto portal meta once"

"on":
  push:
    paths:
      - ".github/workflows/phyto-meta-once-20260827.yml"

permissions:
  contents: write

jobs:
  apply-meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply metadata
        run: python .github/scripts/phyto_meta_20260827.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/phyto/index.html client/phyto/contract.html client/phyto/quote.html client/phyto/business-registration.html client/phyto/bank-account.html
          if git diff --cached --quiet; then
            echo "No metadata changes required"
            exit 0
          fi
          git commit -m "Apply Nineworks favicon and social preview to Phyto portal"
          git push

# trigger: simple-20260827
