name: Refresh brand asset cache keys

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cache-bust-brand-assets.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh favicon and preview cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('favicon.png?v=20260822-1', 'favicon.png?v=20260825-1')
          s = s.replace('favicon.svg?v=20260822-1', 'favicon.svg?v=20260825-1')
          s = s.replace('assets/kakao-preview.png?v=20260822-1', 'assets/kakao-preview.png?v=20260825-1')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit cache key refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No cache key changes needed.'
            exit 0
          fi
          git commit -m 'Refresh preview and favicon cache keys'
          git push