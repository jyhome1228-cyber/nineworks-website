name: Unify social preview image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unify-social-preview.yml'

permissions:
  contents: write

jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply one preview image to every HTML page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          IMAGE = 'https://9works.kr/assets/kakao-preview.png?v=20260825-2'
          OG_TAG = f'<meta property="og:image" content="{IMAGE}">'
          OG_SECURE_TAG = f'<meta property="og:image:secure_url" content="{IMAGE}">'
          TW_TAG = f'<meta name="twitter:image" content="{IMAGE}">'
          TW_CARD = '<meta name="twitter:card" content="summary_large_image">'

          changed = []
          skipped = []

          def replace_meta(html, attr, key, replacement):
              pattern = re.compile(
                  rf'<meta\b(?=[^>]*\b{attr}\s*=\s*["\']{re.escape(key)}["\'])[^>]*>',
                  re.I
              )
              if pattern.search(html):
                  return pattern.sub(replacement, html), True
              return html, False

          for path in sorted(Path('.').rglob('*.html')):
              if '.git' in path.parts:
                  continue
              try:
                  html = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  skipped.append(str(path))
                  continue
              if not re.search(r'<head\b', html, re.I):
                  skipped.append(str(path))
                  continue

              original = html

              # Replace any existing preview image tags with the same NINEWORKS image.
              html, has_og = replace_meta(html, 'property', 'og:image', OG_TAG)
              html, has_secure = replace_meta(html, 'property', 'og:image:secure_url', OG_SECURE_TAG)
              html, has_tw = replace_meta(html, 'name', 'twitter:image', TW_TAG)
              html, has_card = replace_meta(html, 'name', 'twitter:card', TW_CARD)

              # Insert missing tags immediately before </head> so every page has them.
              missing = []
              if not has_og:
                  missing.append(OG_TAG)
              if not has_secure:
                  missing.append(OG_SECURE_TAG)
              if not has_tw:
                  missing.append(TW_TAG)
              if not has_card:
                  missing.append(TW_CARD)

              # Add standard image metadata only when absent.
              if not re.search(r'<meta\b(?=[^>]*\bproperty\s*=\s*["\']og:image:type["\'])[^>]*>', html, re.I):
                  missing.append('<meta property="og:image:type" content="image/png">')

              if missing:
                  block = '\n  ' + '\n  '.join(missing) + '\n'
                  html, n = re.subn(r'</head\s*>', block + '</head>', html, count=1, flags=re.I)
                  if n == 0:
                      skipped.append(str(path))
                      continue

              if html != original:
                  path.write_text(html, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated HTML files: {len(changed)}')
          for p in changed:
              print('  UPDATED', p)
          if skipped:
              print(f'Skipped files: {len(skipped)}')
              for p in skipped:
                  print('  SKIPPED', p)
          PY

      - name: Commit unified previews
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Unify social preview image across all pages"
          git push
