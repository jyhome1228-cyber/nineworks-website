name: Wire client contract payment once

on:
  push:
    paths:
      - '.github/workflows/wire-client-contract-payment-20260827.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire modules
        run: python .github/scripts/wire_client_contract_payment_20260827.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html client/phyto/index.html client/phyto/contract.html
          if git diff --cached --quiet; then
            echo "No wiring changes required"
            exit 0
          fi
          git commit -m "Wire client contract consent and payment status"
          git push

