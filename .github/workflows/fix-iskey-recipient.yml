name: Fix ISKEY recipient references

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-iskey-recipient.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace introduction-only references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('proposal/iskey/index.html'),
              Path('proposal/iskey/print.html'),
              Path('proposal/iskey/quotation.html'),
          ]

          for p in files:
              s = p.read_text(encoding='utf-8')
              s = s.replace('ISKEY / Notefolio Agency', 'ISKEY')
              s = s.replace('ISKEY / Notefolio', 'ISKEY')
              s = s.replace('노트폴리오 에이전시 / 송진석 이사님', '이즈키 브랜드 담당자 귀하')
              s = re.sub(
                  r'<p class="closing-thanks">[^<]*송진석 이사님[^<]*</p>',
                  '<p class="closing-thanks">문의 주셔서 감사합니다. 이즈키의 첫 론칭이 이후 브랜드의 기준이 될 수 있도록, 프로젝트 전 과정에서 일관된 시각 시스템과 완성도 높은 결과물을 준비하겠습니다.</p>',
                  s,
              )
              s = re.sub(
                  r'<p class="thanks">[^<]*송진석 이사님[^<]*</p>',
                  '<p class="thanks">문의 주셔서 감사합니다. 이즈키의 첫 론칭이 이후 브랜드의 기준이 될 수 있도록, 프로젝트 전 과정에서 일관된 시각 시스템과 완성도 높은 결과물을 준비하겠습니다.</p>',
                  s,
              )
              p.write_text(s, encoding='utf-8')

          remaining = []
          for p in files:
              s = p.read_text(encoding='utf-8')
              for token in ('Notefolio', '노트폴리오', '송진석'):
                  if token in s:
                      remaining.append(f'{p}: {token}')
          if remaining:
              raise SystemExit('Remaining references: ' + ', '.join(remaining))
          PY
      - name: Commit corrected documents
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add proposal/iskey/index.html proposal/iskey/print.html proposal/iskey/quotation.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Remove introduction-only references from ISKEY proposal'
            git push
          fi
