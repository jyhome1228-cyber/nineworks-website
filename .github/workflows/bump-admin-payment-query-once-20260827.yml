name: Refresh admin payment module once

on:
  push:
    paths:
      - '.github/workflows/bump-admin-payment-query-once-20260827.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump module cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('admin-client-contract-payment-20260827.js?v=20260827-1', 'admin-client-contract-payment-20260827.js?v=20260827-2')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh admin client payment controls"
          git push
