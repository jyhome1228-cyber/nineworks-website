name: Refine about single column layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/about-single-column.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update about section layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('about.html')
          html = path.read_text(encoding='utf-8')

          old = ".about-section{padding:88px 0;border-bottom:1px solid var(--line)}.about-section--soft{background:#f5f5f3}.about-split{display:grid;grid-template-columns:220px minmax(0,1fr);gap:86px}.about-index{color:#777;font-size:11px;font-weight:600;letter-spacing:.07em}.about-content h2{max-width:18ch;font-size:clamp(29px,2.8vw,40px);font-weight:500;line-height:1.16;letter-spacing:-.045em}.about-content>p{max-width:760px;margin-top:22px;color:#555;font-size:15px;line-height:1.85}.about-content .lead{color:#222;font-size:17px!important}"
          new = ".about-section{padding:96px 0;border-bottom:1px solid var(--line)}.about-section--soft{background:#f5f5f3}.about-split{display:block}.about-index{margin:0 0 38px;color:#777;font-size:11px;font-weight:600;letter-spacing:.07em}.about-content{width:100%}.about-content>.eyebrow{margin:0 0 22px}.about-content h2{max-width:18ch;margin:0;font-size:clamp(29px,2.8vw,40px);font-weight:500;line-height:1.16;letter-spacing:-.045em}.about-content>p{max-width:760px;margin-top:24px;color:#555;font-size:15px;line-height:1.85}.about-content .lead{color:#222;font-size:17px!important}"

          if old not in html:
              raise SystemExit('Target CSS block not found')
          html = html.replace(old, new, 1)

          old_media = "@media(max-width:900px){.about-hero__grid,.about-split{grid-template-columns:1fr;gap:28px}.about-principles{grid-template-columns:1fr}.about-row{grid-template-columns:42px 1fr}.about-row p{grid-column:2}.about-ideation-grid{grid-template-columns:1fr;gap:14px;margin-top:36px}}"
          new_media = "@media(max-width:900px){.about-hero__grid{grid-template-columns:1fr;gap:28px}.about-index{margin-bottom:30px}.about-principles{grid-template-columns:1fr}.about-row{grid-template-columns:42px 1fr}.about-row p{grid-column:2}.about-ideation-grid{grid-template-columns:1fr;gap:14px;margin-top:36px}}"
          if old_media not in html:
              raise SystemExit('Target responsive CSS block not found')
          html = html.replace(old_media, new_media, 1)

          old_mobile = "@media(max-width:680px){.about-hero,.about-section{padding:64px 0}.about-row{gap:14px}.about-content>p{font-size:14.5px}}"
          new_mobile = "@media(max-width:680px){.about-hero,.about-section{padding:64px 0}.about-index{margin-bottom:26px}.about-content>.eyebrow{margin-bottom:18px}.about-row{gap:14px}.about-content>p{font-size:14.5px}}"
          if old_mobile not in html:
              raise SystemExit('Target mobile CSS block not found')
          html = html.replace(old_mobile, new_mobile, 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit about layout refinement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html
          git commit -m "Refine About sections to single-column layout"
          git push
