<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <filter id="whiteLogo" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="SourceAlpha" operator="in" result="whiteShape"/>
      <feMerge><feMergeNode in="whiteShape"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#050505"/>
  <image href="logo-nineworks.svg" x="274" y="276" width="652" height="79" preserveAspectRatio="xMidYMid meet" filter="url(#whiteLogo)"/>
</svg>
