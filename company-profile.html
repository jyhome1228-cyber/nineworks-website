<body>
<div class="toolbar"><a href="/">9works.kr</a><button onclick="window.print()">PDF 저장 / PRINT</button></div>
<main class="deck" id="deck"></main>
<script>
const deck=document.getElementById('deck');let pn=0;
function add(content,cls=''){pn++;deck.insertAdjacentHTML('beforeend',`<section class="page ${cls}">${content}<span class="page-no">${String(pn).padStart(2,'0')}</span></section>`)}
function pad(content){return `<div class="pad">${content}</div>`}
function top(right){return `<div class="topline"><span class="brand">NINEWORKS</span><span>${right}</span></div>`}
add(pad(`<div class="cover-logo">NINEWORKS</div><h1>COMPANY<br>PROFILE</h1><div class="cover-meta"><span>BRAND STRATEGY · IDENTITY · DIGITAL · PRODUCTION</span><span>2026 / SEOUL · INCHEON, KOREA</span></div>`),'cover');
add(pad(`<p class="kicker">NINEWORKS / BRANDING STUDIO</p><h2 class="display">브랜드의 방향을 만들고, 기억될 장면을 설계합니다.</h2><p class="body">브랜드 전략과 아이덴티티를 중심으로 이름, 패키지, 콘텐츠, 공간과 디지털 환경까지 하나의 인상으로 연결합니다. 보기 좋은 결과물 하나보다 여러 환경에서 반복해서 사용할 수 있는 기준과 구조를 만드는 일을 중요하게 생각합니다.</p>`),'quote-page');
add(pad(`${top('ABOUT / WHO WE ARE')}<div class="statement"><div><p class="kicker">ABOUT NINEWORKS</p><h2 class="title">브랜드의 생각을 분명한 기준으로 만들고 실제 접점까지 연결합니다.</h2></div><div class="statement-copy"><p class="lead">나인웍스는 브랜드 전략과 아이덴티티에서 시작해 패키지, 웹사이트와 디지털 시스템, 콘텐츠와 실제 제작까지 하나의 방향으로 연결하는 디자인 스튜디오입니다.</p><p class="body">시장과 고객, 제품과 운영 환경을 먼저 이해하고 무엇을 남기고 무엇을 바꿀지 정리한 뒤 시각 결과물로 구체화합니다. 디자인이 실제 생산·판매·운영에서 계속 사용된다는 점을 고려해 제작 가능성, 정보 구조, 반응형 환경, 양산 조건과 유지·운영의 편의까지 함께 살핍니다.</p></div></div><div class="statbar"><div><strong>2017—</strong><span>DESIGN PRACTICE</span></div><div><strong>Brand → System</strong><span>IDENTITY TO REAL USE</span></div><div><strong>Seoul · Incheon</strong><span>KOREA</span></div></div>`));
add(pad(`${top('ORIGIN / EVOLUTION')}<div class="cols" style="margin-top:2.6cqw"><div><p class="kicker">SINCE 2017</p><h2 class="title">개별 디자인에서 브랜드가 반복해서 사용할 수 있는 구조로.</h2></div><div><p class="lead">나인웍스의 출발은 디자인 실무였습니다. 프로젝트가 쌓일수록 중요한 것은 결과물 하나의 완성도보다 서로 다른 채널이 같은 브랜드처럼 보이게 만드는 기준이라는 점을 확인했습니다.</p><p class="body" style="margin-top:.8cqw">현재는 브랜드의 방향을 이해하고 아이덴티티를 정리한 뒤 제품과 패키지, 디지털, 에디토리얼, 콘텐츠와 실제 제작 환경으로 확장합니다.</p></div></div><div class="timeline"><div class="time"><div class="dot"></div><b>2017</b><p>디자인 실무 시작. 로고·패키지·콘텐츠 중심의 경험 축적.</p></div><div class="time"><div class="dot"></div><b>2020</b><p>NINEWORKS 운영. 브랜드 아이덴티티와 기업 프로젝트 확대.</p></div><div class="time"><div class="dot"></div><b>2022</b><p>기업·기관 협업과 프로젝트 운영 체계 확장.</p></div><div class="time"><div class="dot"></div><b>2024</b><p>연구·교육·심사·컨설팅으로 디자인의 역할 확장.</p></div><div class="time"><div class="dot"></div><b>2026</b><p>Brand · Digital · Production을 연결하는 통합 스튜디오.</p></div></div>`));
add(pad(`${top('PERSPECTIVE')}<div style="margin-top:2.5cqw"><p class="kicker">CLARITY BEFORE DECORATION</p><h2 class="title">보기 좋은 결과보다 오래 사용할 수 있는 기준을 만듭니다.</h2><p class="body" style="max-width:48cqw;margin-top:.9cqw">시각적 표현은 목적이 아니라 브랜드가 더 정확하게 말하고 선택하기 위한 수단입니다. 시장과 고객이 실제로 만나는 접점에서 일관된 인상이 유지되도록 설계합니다.</p></div><div class="beliefs"><article><i>01 / UNDERSTAND</i><h3>Understand the brand.</h3><p>브랜드의 배경, 제품, 시장, 고객과 현재 문제를 이해하고 실제로 해결해야 할 지점을 찾습니다.</p></article><article><i>02 / SYSTEM</i><h3>Set a visual rule.</h3><p>타이포그래피, 컬러, 이미지와 레이아웃이 여러 접점에서 같은 인상을 만들도록 기준을 세웁니다.</p></article><article><i>03 / DELIVERY</i><h3>Design for real use.</h3><p>패키지는 양산을, 웹은 운영을, 인쇄물은 반복 활용을 함께 고려해 실제 사용 가능한 결과를 만듭니다.</p></article></div>`));
add(pad(`${top('HOW WE WORK')}<div style="margin-top:2.5cqw"><p class="kicker">PROCESS</p><h2 class="title">Understand. Define. Design. Expand.</h2><p class="body" style="max-width:47cqw;margin-top:.85cqw">결과물은 달라도 브랜드를 이해하고 기준을 세운 뒤 실제 결과로 만들고 운영 환경으로 확장하는 순서는 유지합니다.</p></div><div class="process"><article><b>01 / UNDERSTAND</b><h3>Understand</h3><p>시장과 고객, 제품, 기존 자료와 운영 환경을 검토합니다.</p></article><article><b>02 / DEFINE</b><h3>Define</h3><p>브랜드가 가져야 할 인상과 메시지, 프로젝트 범위를 정의합니다.</p></article><article><b>03 / DESIGN</b><h3>Design</h3><p>타이포그래피, 컬러, 이미지, 그래픽과 화면을 구체화합니다.</p></article><article><b>04 / EXPAND</b><h3>Expand</h3><p>완성된 기준을 제품, 화면, 콘텐츠, 인쇄와 공간으로 확장합니다.</p></article></div>`));
