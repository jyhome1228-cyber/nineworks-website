    .design-academy-page{background:#f4f3ef;color:#111}
    .design-academy-page main{min-height:calc(100vh - 72px);display:flex;align-items:stretch}
    .academy-coming{width:100%;display:flex;align-items:flex-end;border-bottom:1px solid rgba(17,17,17,.14)}
    .academy-coming__inner{width:100%;padding-top:150px;padding-bottom:76px}
    .academy-coming__kicker{margin:0 0 52px;font-size:10px;font-weight:600;letter-spacing:.09em;color:#777}
    .academy-coming__grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.65fr);gap:96px;align-items:end}
    .academy-coming__status{display:inline-flex;margin-bottom:20px;padding:7px 11px;border:1px solid #bbb8b0;border-radius:99px;font-size:9px;font-weight:600;letter-spacing:.07em;color:#69665f}
    .academy-coming h1{max-width:850px;margin:0;font-size:clamp(48px,5.6vw,82px);font-weight:500;line-height:1.02;letter-spacing:-.06em;word-break:keep-all}
    .academy-coming__side{max-width:520px;justify-self:end}
    .academy-coming__side p{margin:0;color:#57544e;font-size:14px;line-height:1.85;letter-spacing:-.02em;word-break:keep-all}
    .academy-coming__link{display:flex;align-items:center;justify-content:space-between;margin-top:28px;padding:16px 0;border-top:1px solid #77736b;border-bottom:1px solid #77736b;font-size:13px;font-weight:500;transition:opacity .18s ease}
    .academy-coming__link:hover{opacity:.55}
    .design-academy-page .site-footer{margin-top:0}
    @media(max-width:1040px){
      .academy-coming__inner{padding-top:126px;padding-bottom:58px}
      .academy-coming__grid{grid-template-columns:1fr;gap:44px}
      .academy-coming__side{max-width:660px;justify-self:start}
      .academy-coming__kicker{margin-bottom:38px}
    }
    @media(max-width:680px){
      .design-academy-page main{min-height:calc(100vh - 62px)}
      .academy-coming__inner{padding-top:104px;padding-bottom:40px}
      .academy-coming__kicker{margin-bottom:30px}
      .academy-coming h1{font-size:clamp(42px,12vw,58px);line-height:1.05}
      .academy-coming__grid{gap:36px}
      .academy-coming__side p{font-size:13.5px;line-height:1.75}
    }
